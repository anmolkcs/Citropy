appId: com.citropy.custom-desktop
productName: Citropy Custom
directories:
  app: .desktop-build
  output: release
asar: false
npmRebuild: false
files:
  - desktop/**
  - '!desktop/**/__pycache__/**'
  - server/**
  - shared/**
  - skills/**
  - scripts/install.sh
  - dist/**
  - package.json
  - LICENSE
  - '!desktop/package.mjs'
  - '!desktop/electron-builder.yml'
  - '!desktop/install.mjs'
  - '!desktop/computer-mac-build.mjs'
  - '!desktop/computer-mac.swift'
  - '!desktop/start.mjs'
  - '!desktop/smoke.mjs'
  - '!desktop/smoke-mac.mjs'
  - '!desktop/smoke-win.mjs'
  - '!desktop/smoke-terminal.mjs'
linux:
  target: AppImage
  category: Development
  icon: desktop/assets/citropy.png
  executableName: citropy-custom
  syncDesktopName: true
  artifactName: Citropy-Custom-${version}-${arch}.AppImage
mac:
  target:
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: desktop/assets/citropy.png
  identity: '-'
  hardenedRuntime: false
  artifactName: Citropy-Custom-${version}-${arch}.zip
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: desktop/assets/citropy.png
  artifactName: Citropy-Custom-${version}-${arch}-Setup.exe
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: tinuxongit
  repo: Citropy
  private: false
